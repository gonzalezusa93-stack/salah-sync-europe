<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salah Sync - AI Powered</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00838F;
            --accent: #00bcd4; /* Cian eléctrico para IA */
            --dark: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --safe: #00c853;
            --warn: #d50000;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; /* Fondo claro para que destaque la app */
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* CONTENEDOR MÓVIL */
        .app-container {
            background: var(--dark);
            color: var(--text);
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            position: relative;
        }

        /* --- HEADER & NAV --- */
        .header {
            padding: 20px;
            background: linear-gradient(180deg, #263238 0%, var(--dark) 100%);
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .brand { font-weight: 800; letter-spacing: 1px; font-size: 1.1rem; }
        .brand span { color: var(--accent); }
        
        /* Selector Ciudad */
        .city-select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            outline: none;
        }
        .city-select option { background: var(--dark); }

        /* Semáforo */
        .creator-status {
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: block; }
        .status-safe .dot { background: var(--safe); box-shadow: 0 0 10px var(--safe); }
        .status-warn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }

        /* --- SECCIÓN RELOJ --- */
        .timer-box {
            text-align: center;
            padding: 30px 0;
        }
        .timer {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(0,188,212,0.2);
        }
        .next-info { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; }

        /* --- SECCIÓN IA (NUEVO) --- */
        .ai-section {
            background: linear-gradient(135deg, #006064 0%, #00363a 100%);
            margin: 10px 20px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0,188,212,0.3);
            position: relative;
            overflow: hidden;
        }
        .ai-badge {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.7rem;
            background: var(--accent);
            color: black;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .ai-question { font-size: 0.9rem; margin-bottom: 10px; font-weight: 600; }
        .mood-buttons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .mood-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .mood-btn:hover, .mood-btn.active { background: var(--accent); color: black; }
        .ai-response {
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            display: none; /* Oculto hasta que se active */
            border-left: 3px solid var(--accent);
        }

        /* --- SLOT PUBLICIDAD (MONETIZACIÓN) --- */
        .ad-slot {
            margin: 20px;
            height: 60px;
            background: #252525;
            border: 1px dashed #444;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .ad-slot:hover { background: #2a2a2a; color: #777; }

        /* --- LISTA REZOS --- */
        .prayer-list { padding: 0 20px; padding-bottom: 80px; }
        .prayer-item {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }
        .prayer-item.active {
            color: var(--accent);
            font-weight: bold;
            background: linear-gradient(90deg, transparent, rgba(0,188,212,0.05));
        }

        /* --- FOOTER QIBLA --- */
        .qibla-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: #1a1a1a;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .qibla-arrow { color: var(--accent); transform: rotate(0deg); transition: transform 1s; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="top-bar">
                <div class="brand">SALAH <span>SYNC</span></div>
                <select id="citySelector" class="city-select" onchange="manualLocation()">
                    <option value="auto">📍 GPS Auto</option>
                    <option value="40.4168,-3.7038">Madrid</option>
                    <option value="41.3851,2.1734">Barcelona</option>
                    <option value="48.8566,2.3522">París</option>
                    <option value="51.5074,-0.1278">Londres</option>
                    <option value="52.5200,13.4050">Berlín</option>
                    <option value="41.9028,12.4964">Roma</option>
                    <option value="52.3676,4.9041">Ámsterdam</option>
                    <option value="50.8503,4.3517">Bruselas</option>
                </select>
            </div>

            <div id="statusBox" class="creator-status status-safe">
                <span class="dot"></span>
                <span id="statusText">Listo para grabar</span>
            </div>

            <div class="timer-box">
                <div class="next-info">PRÓXIMO: <span id="nextName">--</span></div>
                <div class="timer" id="timer">--:--:--</div>
                <div style="font-size:0.8rem; color:#666" id="hijriDate">Cargando...</div>
            </div>
        </div>

        <div class="ai-section">
            <div class="ai-badge">AI BETA</div>
            <div class="ai-question">¿Cómo está tu energía creativa hoy?</div>
            <div class="mood-buttons">
                <button class="mood-btn" onclick="askAI('focus')">🎯 Enfocado</button>
                <button class="mood-btn" onclick="askAI('stressed')">😫 Estresado</button>
                <button class="mood-btn" onclick="askAI('blocked')">🧱 Bloqueado</button>
                <button class="mood-btn" onclick="askAI('grateful')">🤲 Agradecido</button>
            </div>
            <div id="aiResponse" class="ai-response"></div>
        </div>

        <div class="ad-slot" onclick="alert('Espacio reservado para patrocinadores. Contacta con Muslim Euro Hub.')">
            <span>📢 Espacio Patrocinado (Tu Marca Aquí)</span>
        </div>

        <div class="prayer-list" id="prayerList"></div>

        <div class="qibla-footer">
            <i class="fas fa-location-arrow qibla-arrow" id="qiblaIcon"></i>
            <span style="font-size:0.9rem">Qibla: <strong id="qiblaValue">--°</strong></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.0/Bundles/adhan.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-hijri/2.1.2/moment-hijri.min.js"></script>

    <script>
        let currentCoords = null;
        let prayerTimesGlobal = null;

        function init() {
            // Intenta GPS primero
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => runCalculation(pos.coords.latitude, pos.coords.longitude),
                    () => manualLocation() // Si falla, usa el valor del selector
                );
            } else {
                manualLocation();
            }
        }

        function manualLocation() {
            const val = document.getElementById('citySelector').value;
            if (val === 'auto') {
                init(); // Reintentar GPS
            } else {
                const [lat, lng] = val.split(',').map(Number);
                runCalculation(lat, lng);
            }
        }

        function runCalculation(lat, lng) {
            currentCoords = new adhan.Coordinates(lat, lng);
            const date = new Date();
            const params = adhan.CalculationMethod.MuslimWorldLeague();
            params.madhab = adhan.Madhab.Shafi;
            params.highLatitudeRule = adhan.HighLatitudeRule.SeventhOfTheNight;

            prayerTimesGlobal = new adhan.PrayerTimes(currentCoords, date, params);
            
            updateUI(prayerTimesGlobal);
            startTimer(prayerTimesGlobal);
            
            // Qibla
            const qibla = adhan.Qibla(currentCoords);
            document.getElementById('qiblaValue').innerText = qibla.toFixed(0) + "°";
            document.getElementById('qiblaIcon').style.transform = `rotate(${qibla}deg)`;
            
            // Fecha
            document.getElementById('hijriDate').innerText = moment().format('iD iMMMM iYYYY') + " AH";
        }

        function updateUI(times) {
            const list = document.getElementById('prayerList');
            list.innerHTML = '';
            const names = { fajr: 'Fajr', sunrise: 'Amanecer', dhuhr: 'Dhuhr', asr: 'Asr', maghrib: 'Maghrib', isha: 'Isha' };
            const now = new Date();
            let nextFound = false;

            for (const [key, name] of Object.entries(names)) {
                const time = times[key];
                const timeStr = moment(time).format('HH:mm');
                const isNext = !nextFound && time > now && key !== 'sunrise';
                
                const div = document.createElement('div');
                div.className = `prayer-item ${isNext ? 'active' : ''}`;
                div.innerHTML = `<span>${name}</span> <span>${timeStr}</span>`;
                list.appendChild(div);

                if (isNext) {
                    document.getElementById('nextName').innerText = name;
                    nextFound = true;
                }
            }
        }

        function startTimer(times) {
            setInterval(() => {
                const now = new Date();
                const next = times.nextPrayer();
                if (next === 'none') return;
                
                const diff = times[next.toLowerCase()] - now;
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);
                
                document.getElementById('timer').innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

                // Lógica Semáforo IA
                const totalMinutes = hours * 60 + minutes;
                const box = document.getElementById('statusBox');
                if (totalMinutes < 20) {
                    box.className = 'creator-status status-warn';
                    box.innerHTML = '<span class="dot"></span> Pausa: Rezo cerca';
                } else {
                    box.className = 'creator-status status-safe';
                    box.innerHTML = '<span class="dot"></span> Graba tranquilo';
                }
            }, 1000);
        }

        // --- SISTEMA DE INTELIGENCIA ARTIFICIAL (SIMULADA) ---
        function askAI(mood) {
            const responseBox = document.getElementById('aiResponse');
            const buttons = document.querySelectorAll('.mood-btn');
            
            // Efecto visual selección
            buttons.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            responseBox.style.display = 'block';
            responseBox.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Analizando contexto...';

            // Algoritmo de decisión
            setTimeout(() => {
                let text = "";
                
                if (mood === 'focus') {
                    text = "💡 <strong>Consejo IA:</strong> Tu energía es alta. Aprovecha los próximos 45 minutos para tareas profundas (" + document.getElementById('nextName').innerText + " marca tu límite). Recuerda: 'La mejor obra es la constante'.";
                } else if (mood === 'stressed') {
                    text = "🌿 <strong>Pausa Inteligente:</strong> Detecto tensión. Aléjate de la pantalla 5 minutos. Haz Dhikr suave (SubhanAllah). Tu creatividad volverá cuando tu mente se calme.";
                } else if (mood === 'blocked') {
                    text = "🚀 <strong>Desbloqueo:</strong> No busques la perfección. Solo graba 2 minutos 'malos' para romper el hielo. Lee la Sura Al-Inshirah (94) para abrir tu pecho.";
                } else if (mood === 'grateful') {
                    text = "✨ <strong>Resonancia:</strong> Alhamdulillah. Esa gratitud es imán para más éxito. Comparte ese sentimiento en tu contenido hoy, tu audiencia necesita esa luz.";
                }

                responseBox.innerHTML = text;
            }, 800); // Pequeño retraso para que parezca que "piensa"
        }

        function pad(n) { return n < 10 ? '0'+n : n; }

        init();
    </script>
</body>
</html>
