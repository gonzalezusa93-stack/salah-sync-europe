<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salah Sync - Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00838F;
            --accent: #00bcd4;
            --dark: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --safe: #00c853;
            --warn: #d50000;
            --gold: #FFD700;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* APP CONTAINER */
        .app-container {
            background: var(--dark);
            color: var(--text);
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
            position: relative;
        }

        /* HEADER */
        .header {
            padding: 20px;
            background: linear-gradient(180deg, #263238 0%, var(--dark) 100%);
            text-align: center;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .brand { font-weight: 800; letter-spacing: 1px; font-size: 1.1rem; }
        .brand span { color: var(--accent); }
        .city-select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        /* Semáforo */
        .creator-status {
            background: rgba(255,255,255,0.05);
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: block; }
        .status-safe .dot { background: var(--safe); box-shadow: 0 0 10px var(--safe); }
        .status-warn .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }

        /* RELOJ */
        .timer-box { text-align: center; padding: 30px 0; }
        .timer { font-size: 3.5rem; font-weight: 700; line-height: 1; }
        .next-info { color: #888; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 5px; }

        /* --- SECCIÓN IA (BLOQUEADA POR DEFECTO) --- */
        .ai-section {
            background: linear-gradient(135deg, #006064 0%, #00363a 100%);
            margin: 10px 20px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0,188,212,0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            min-height: 250px; /* Altura mínima para que quepa el botón */
        }
        .ai-badge {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.7rem;
            background: var(--gold);
            color: black;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            z-index: 10;
        }
        .ai-question { font-size: 0.9rem; margin-bottom: 10px; font-weight: 600; }
        .mood-buttons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; filter: blur(4px); pointer-events: none; transition: 0.3s; }
        .mood-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* CAPA DE BLOQUEO (LOCK) */
        .premium-lock {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            text-align: center;
            padding: 20px;
        }
        .lock-icon { font-size: 1.5rem; color: var(--gold); margin-bottom: 10px; }
        .lock-text { font-size: 0.9rem; color: white; margin-bottom: 5px; font-weight: bold; }
        .lock-subtext { font-size: 0.8rem; color: #ccc; margin-bottom: 15px; }
        
        /* Contenedor del Botón PayPal */
        #paypal-button-container-P-3AB601452X2978407NE2LHDQ {
            width: 100%;
            max-width: 250px;
            z-index: 20;
        }

        /* ESTADO DESBLOQUEADO (CLASE VIP) */
        .is-vip .mood-buttons { filter: none; pointer-events: all; }
        .is-vip .premium-lock { display: none; }
        .is-vip .ai-badge { background: var(--accent); content: 'PRO'; color: black; }

        /* LISTA & FOOTER */
        .prayer-list { padding: 0 20px; padding-bottom: 80px; }
        .prayer-item {
            display: flex; justify-content: space-between; padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem;
        }
        .prayer-item.active { color: var(--accent); font-weight: bold; }
        .qibla-footer {
            position: absolute; bottom: 0; width: 100%; background: #1a1a1a;
            padding: 15px 0; display: flex; justify-content: center; gap: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .qibla-arrow { color: var(--accent); transform: rotate(0deg); transition: transform 1s; }
        
        .ai-response {
            margin-top: 15px; font-size: 0.9rem; line-height: 1.4;
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;
            display: none; border-left: 3px solid var(--accent);
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <div class="header">
            <div class="top-bar">
                <div class="brand">SALAH <span>SYNC</span></div>
                <select id="citySelector" class="city-select" onchange="manualLocation()">
                    <option value="auto">📍 GPS Auto</option>
                    <option value="40.4168,-3.7038">Madrid</option>
                    <option value="48.8566,2.3522">París</option>
                    <option value="51.5074,-0.1278">Londres</option>
                    <option value="52.5200,13.4050">Berlín</option>
                </select>
            </div>
            <div id="statusBox" class="creator-status status-safe">
                <span class="dot"></span> <span id="statusText">Listo</span>
            </div>
            <div class="timer-box">
                <div class="next-info">PRÓXIMO: <span id="nextName">--</span></div>
                <div class="timer" id="timer">--:--</div>
                <div style="font-size:0.8rem; color:#666" id="hijriDate">...</div>
            </div>
        </div>

        <div class="ai-section">
            <div class="ai-badge">PREMIUM</div>
            
            <div class="premium-lock">
                <i class="fas fa-lock lock-icon"></i>
                <div class="lock-text">Desbloquea el Coach IA</div>
                <div class="lock-subtext">Suscripción Mensual (5,00€)</div>
                
                <div id="paypal-button-container-P-3AB601452X2978407NE2LHDQ"></div>
            </div>

            <div class="ai-question">¿Cómo está tu energía hoy?</div>
            <div class="mood-buttons">
                <button class="mood-btn" onclick="askAI('focus')">🎯 Enfocado</button>
                <button class="mood-btn" onclick="askAI('stressed')">😫 Estresado</button>
                <button class="mood-btn" onclick="askAI('blocked')">🧱 Bloqueado</button>
            </div>
            <div id="aiResponse" class="ai-response"></div>
        </div>

        <div class="prayer-list" id="prayerList"></div>

        <div class="qibla-footer">
            <i class="fas fa-location-arrow qibla-arrow" id="qiblaIcon"></i>
            <span>Qibla: <strong id="qiblaValue">--°</strong></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.0/Bundles/adhan.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-hijri/2.1.2/moment-hijri.min.js"></script>
    
    <script src="https://www.paypal.com/sdk/js?client-id=AR1vDdx40w3Py1CRmJuW74jt8ILcha_Qsi2E4tHS5zBP-JUW3362emCAaKYn8BKnmaTzlf3D_TXHF2Pf&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>
    <script>
      paypal.Buttons({
          style: {
              shape: 'rect',
              color: 'gold',
              layout: 'vertical',
              label: 'subscribe'
          },
          createSubscription: function(data, actions) {
            return actions.subscription.create({
              /* Plan ID de tu suscripción de 5€ */
              plan_id: 'P-3AB601452X2978407NE2LHDQ'
            });
          },
          onApprove: function(data, actions) {
            // ¡AQUÍ ESTÁ LA MAGIA!
            // Cuando el pago es correcto, recargamos la página con la llave VIP
            alert("¡Suscripción Correcta! Desbloqueando IA...");
            window.location.href = window.location.href.split('?')[0] + "?vip=true";
          }
      }).render('#paypal-button-container-P-3AB601452X2978407NE2LHDQ');
    </script>

    <script>
        // --- SISTEMA DE DESBLOQUEO ---
        function checkPremium() {
            const urlParams = new URLSearchParams(window.location.search);
            // Si viene de PayPal (?vip=true) o ya pagó antes (localStorage)
            if (urlParams.get('vip') === 'true' || localStorage.getItem('isVip') === 'true') {
                document.getElementById('app').classList.add('is-vip');
                localStorage.setItem('isVip', 'true'); // Guardar para siempre
            }
        }
        checkPremium(); 

        // --- LÓGICA APP (RELOJ, REZOS, ETC) ---
        function init() { manualLocation(); }
        
        function manualLocation() {
            let val = document.getElementById('citySelector').value;
            if(val === 'auto') {
                 if(navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => runCalc(pos.coords.latitude, pos.coords.longitude));
            } else {
                let [lat, lng] = val.split(',').map(Number);
                runCalc(lat, lng);
            }
        }
        function runCalc(lat, lng) {
            const coords = new adhan.Coordinates(lat, lng);
            const date = new Date();
            const params = adhan.CalculationMethod.MuslimWorldLeague();
            params.madhab = adhan.Madhab.Shafi;
            params.highLatitudeRule = adhan.HighLatitudeRule.SeventhOfTheNight;
            const times = new adhan.PrayerTimes(coords, date, params);
            updateUI(times);
            
            // Qibla
            const qibla = adhan.Qibla(coords);
            document.getElementById('qiblaValue').innerText = qibla.toFixed(0)+"°";
            document.getElementById('qiblaIcon').style.transform = `rotate(${qibla}deg)`;
            document.getElementById('hijriDate').innerText = moment().format('iD iMMMM') + " AH";
        }
        function updateUI(times) {
            const list = document.getElementById('prayerList'); list.innerHTML = '';
            const names = {fajr:'Fajr', dhuhr:'Dhuhr', asr:'Asr', maghrib:'Maghrib', isha:'Isha'};
            const now = new Date();
            let nextFound = false;
            for(const [k,n] of Object.entries(names)){
                const t = times[k];
                const active = !nextFound && t > now;
                if(active) { document.getElementById('nextName').innerText = n; nextFound = true; }
                list.innerHTML += `<div class="prayer-item ${active?'active':''}"><span >${n}</span><span>${moment(t).format('HH:mm')}</span></div>`;
            }
        }
        // IA
        function askAI(m) {
            const r = document.getElementById('aiResponse');
            r.style.display='block'; r.innerText = "Pensando...";
            setTimeout(() => {
                let text = "✨ Consejo: Respira profundo y renueva tu intención.";
                if(m==='stressed') text = "🌿 Pausa: Haz istighfar suavemente y aléjate de la pantalla 5 min.";
                if(m==='focus') text = "🚀 Acción: Tienes 40 min de enfoque total. ¡Aprovéchalo!";
                r.innerHTML = text;
            }, 800);
        }

        init();
    </script>
</body>
</html>
